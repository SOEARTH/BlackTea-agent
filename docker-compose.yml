services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blacktea
      POSTGRES_PASSWORD: blacktea
      POSTGRES_DB: blacktea
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  milvus-etcd:
    image: dhi.io/etcd:3-debian-dev
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://milvus-etcd:2379
    healthcheck:
      test: ['CMD-SHELL', 'etcdctl --endpoints=http://localhost:2379 endpoint health || /opt/bitnami/etcd/bin/etcdctl --endpoints=http://localhost:2379 endpoint health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - etcd_data:/bitnami/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_started
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  pg_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
